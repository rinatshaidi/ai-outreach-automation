x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    APP_HOST: 0.0.0.0
    APP_PORT: 8000
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD:-outreach_dev_only}@postgres:5432/${POSTGRES_DB:-outreach}
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    SMTP_USE_TLS: "false"
    SMTP_FROM_EMAIL: outreach@example.test
    SMTP_FROM_NAME: AI Outreach System
    SMTP_TEST_RECIPIENT: mailpit@example.test
    SMTP_TEST_MODE: "true"
    USER_TIMEZONE: ${USER_TIMEZONE:-Europe/Moscow}
    AI_REWRITE_PROVIDER: ${AI_REWRITE_PROVIDER:-unavailable}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_REWRITE_MODEL: ${OPENAI_REWRITE_MODEL:-gpt-5-mini}
    DEMO_MODE: "true"
    ALLOW_REAL_EMAIL: "false"
    ALLOW_PUBLICATION: "false"
    ALLOW_EXTERNAL_EXPORT: "false"
    AUTH_REQUIRED: "true"
    AUTH_SESSION_MINUTES: "480"
    AUTH_LOGIN_WINDOW_MINUTES: "15"
    AUTH_LOGIN_MAX_ATTEMPTS: "5"
    AUTH_COOKIE_SECURE: "false"
  depends_on:
    postgres:
      condition: service_healthy
    mailpit:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app-common
    profiles: ["dev"]
    environment:
      APP_ENVIRONMENT: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD:-outreach_dev_only}@postgres:5432/${POSTGRES_DB:-outreach}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
      SMTP_FROM_EMAIL: outreach@example.test
      SMTP_FROM_NAME: AI Outreach System
      SMTP_TEST_RECIPIENT: mailpit@example.test
      SMTP_TEST_MODE: "true"
      USER_TIMEZONE: ${USER_TIMEZONE:-Europe/Moscow}
      AI_REWRITE_PROVIDER: ${AI_REWRITE_PROVIDER:-unavailable}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REWRITE_MODEL: ${OPENAI_REWRITE_MODEL:-gpt-5-mini}
      DEMO_MODE: "true"
      ALLOW_REAL_EMAIL: "false"
      ALLOW_PUBLICATION: "false"
      ALLOW_EXTERNAL_EXPORT: "false"
      AUTH_REQUIRED: "true"
      AUTH_SESSION_MINUTES: "480"
      AUTH_LOGIN_WINDOW_MINUTES: "15"
      AUTH_LOGIN_MAX_ATTEMPTS: "5"
      AUTH_COOKIE_SECURE: "false"
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app-demo:
    <<: *app-common
    profiles: ["demo"]
    environment:
      APP_ENVIRONMENT: demo
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD:-outreach_dev_only}@postgres:5432/${POSTGRES_DB:-outreach}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
      SMTP_FROM_EMAIL: outreach@example.test
      SMTP_FROM_NAME: AI Outreach System
      SMTP_TEST_RECIPIENT: mailpit@example.test
      SMTP_TEST_MODE: "true"
      USER_TIMEZONE: ${USER_TIMEZONE:-Europe/Moscow}
      AI_REWRITE_PROVIDER: ${AI_REWRITE_PROVIDER:-unavailable}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REWRITE_MODEL: ${OPENAI_REWRITE_MODEL:-gpt-5-mini}
      DEMO_MODE: "true"
      ALLOW_REAL_EMAIL: "false"
      ALLOW_PUBLICATION: "false"
      ALLOW_EXTERNAL_EXPORT: "false"
      AUTH_REQUIRED: "true"
      AUTH_SESSION_MINUTES: "480"
      AUTH_LOGIN_WINDOW_MINUTES: "15"
      AUTH_LOGIN_MAX_ATTEMPTS: "5"
      AUTH_COOKIE_SECURE: "false"
    command: >-
      sh -c "alembic upgrade head && python scripts/seed_demo.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outreach}
      POSTGRES_USER: ${POSTGRES_USER:-outreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outreach_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outreach} -d ${POSTGRES_DB:-outreach}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "0"
      MP_SMTP_AUTH_ALLOW_INSECURE: "0"
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
